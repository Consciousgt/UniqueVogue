<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details — Unified Vogue</title>
  <meta name="description" content="Product detail view — Unified Vogue luxury fashion catalog."/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="topbar">
    <i class="fa-solid fa-star"></i>&nbsp; Free Nationwide Delivery on Orders Over ₦30,000 &nbsp;<i class="fa-solid fa-star"></i>
  </div>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="images/logo.jpg" alt="Unified Vogue Logo" onerror="this.style.display='none'" />
        <div class="nav-brand-text">
          <span class="nav-brand-name serif">Unified Vogue</span>
          <span class="nav-brand-tag">Your Outfits Speaks Fashion</span>
        </div>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="index.html#contactSection">Contact</a></li>
        <span class="nav-close" id="navClose"><i class="fa-solid fa-xmark"></i></span>
      </ul>

      <div class="nav-actions">
        <a href="cart.html" class="nav-icon" title="Shopping Bag">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="nav-badge" id="navCartBadge">0</span>
        </a>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <!-- Product Detail Content -->
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">Home</a>
      <i class="fa-solid fa-chevron-right"></i>
      <a href="shop.html">Shop</a>
      <i class="fa-solid fa-chevron-right"></i>
      <span id="breadcrumbTitle">Product</span>
    </nav>

    <div class="detail-layout" id="detailContainer">
      <!-- JS Injected -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2025 Unified Vogue. All Rights Reserved.</span>
        <a href="shop.html" style="color:var(--gold);">← Back to Catalog</a>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>

  <script>
    let selectedSize = 'S';
    let selectedQty = 1;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'uv-1';
      const p = ProductsAPI.getProductById(prodId);
      const container = document.getElementById('detailContainer');

      if (!p) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:80px 20px;">
            <i class="fa-solid fa-box-open" style="font-size:3rem; color:var(--border-gold); display:block; margin-bottom:14px;"></i>
            <h2 class="serif" style="margin-bottom:8px;">Product Not Found</h2>
            <p style="color:var(--grey); margin-bottom:20px;">This item is currently unavailable.</p>
            <a href="shop.html" class="btn btn-gold">Return to Shop</a>
          </div>`;
        return;
      }

      document.getElementById('breadcrumbTitle').textContent = p.name;
      document.title = `${p.name} — Unified Vogue`;
      selectedSize = p.sizes ? p.sizes[0] : 'S';

      container.innerHTML = `
        <div class="detail-gallery">
          <div class="gallery-main">
            <img src="${p.image}" alt="${p.name}" />
          </div>
        </div>

        <div class="detail-info">
          <div class="detail-badge-row">
            <span class="badge">${p.badge || 'New'}</span>
            <span class="detail-cat">${p.category}</span>
          </div>

          <h1 class="detail-title serif">${p.name}</h1>

          <div class="detail-stars">
            <span class="stars">★★★★★</span>
            <span class="star-note">${p.rating} rating · ${p.stock} in stock</span>
          </div>

          <div class="detail-price">${App.formatMoney(p.price)}</div>

          <p class="detail-desc">${p.description}</p>

          <div class="size-label">Select Size</div>
          <div class="size-btns" id="sizeBtns">
            ${(p.sizes || ['S','M','L','XL','XXL']).map((s, i) => `
              <button class="size-btn ${i === 0 ? 'on' : ''}" onclick="setSize(this, '${s}')">${s}</button>
            `).join('')}
          </div>

          <div class="qty-row">
            <span class="qty-label">Quantity:</span>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <span class="qty-num" id="qtyNum">1</span>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>

          <div class="detail-cta">
            <button class="btn btn-gold" onclick="addToBag()">
              <i class="fa-solid fa-bag-shopping"></i> Add to Bag
            </button>
            <a href="cart.html" class="btn btn-outline">
              <i class="fa-solid fa-bag-shopping"></i> View Bag
            </a>
          </div>

          <div class="detail-info-box">
            <div class="info-row">
              <i class="fa-solid fa-truck-fast"></i>
              <span>Express nationwide shipping — delivered in 24 hours</span>
            </div>
            <div class="info-row">
              <i class="fa-solid fa-shield-halved"></i>
              <span>Guaranteed authentic Unified Vogue design</span>
            </div>
            <div class="info-row">
              <i class="fa-brands fa-whatsapp"></i>
              <span>Instant order verification via WhatsApp</span>
            </div>
          </div>
        </div>
      `;

      const toggle = document.getElementById('navToggle');
      const links = document.getElementById('navLinks');
      const close = document.getElementById('navClose');
      if (toggle && links) {
        toggle.addEventListener('click', () => links.classList.add('open'));
        if (close) close.addEventListener('click', () => links.classList.remove('open'));
      }
    });

    function setSize(btn, size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    }

    function changeQty(delta) {
      selectedQty = Math.max(1, selectedQty + delta);
      document.getElementById('qtyNum').textContent = selectedQty;
    }

    function addToBag() {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'uv-1';
      CartManager.addToCart(prodId, selectedQty, selectedSize);
    }
  </script>
</body>
</html>

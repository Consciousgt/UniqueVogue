<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details — Unified Vogue</title>
  <meta name="description" content="Product detail view — Unified Vogue luxury fashion catalog."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://unifiedvogue-b8a97-default-rtdb.firebaseio.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ── Size Chart Modal ─────────────────────────────────────────── */
    .sc-overlay {
      display: none; position: fixed; inset: 0; z-index: 4000;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .sc-overlay.open { display: flex; }
    .sc-modal {
      background: var(--black-card); border: 1px solid var(--border-gold);
      border-radius: var(--r-lg); max-width: 640px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
      animation: scSlide 0.28s cubic-bezier(0.25,1,0.5,1) both;
    }
    @keyframes scSlide { from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;} }
    .sc-header {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sc-header h3 { font-size: 1.1rem; font-weight: 600; font-family: var(--font-d); color: var(--gold-light); }
    .sc-header p { font-size: 0.78rem; color: var(--grey); margin-top: 2px; }
    .sc-close {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--grey); width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; transition: var(--ease); flex-shrink: 0;
    }
    .sc-close:hover { border-color: var(--gold); color: var(--gold); }
    .sc-body { padding: 20px 22px; }

    /* How to Measure tip */
    .sc-tip {
      background: rgba(197,160,89,0.07); border-left: 3px solid var(--gold);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: 12px 14px; margin-bottom: 18px;
      font-size: 0.82rem; color: var(--grey); line-height: 1.6;
    }
    .sc-tip strong { color: var(--gold-light); }

    /* Size chart table */
    .sc-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sc-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    .sc-table thead th {
      background: var(--black); color: var(--gold);
      padding: 10px 14px; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 1.5px; font-weight: 700; text-align: center;
      border-bottom: 1px solid var(--border-gold);
    }
    .sc-table thead th:first-child { text-align: left; }
    .sc-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
    }
    .sc-table tbody tr:last-child { border-bottom: none; }
    .sc-table tbody tr:hover { background: rgba(197,160,89,0.08); }
    .sc-table td {
      padding: 12px 14px; text-align: center; color: var(--grey);
    }
    .sc-table td:first-child {
      text-align: left; font-weight: 800; color: var(--gold-light);
      letter-spacing: 1px; font-size: 0.88rem;
    }
    .sc-table tr.selected-row td { background: rgba(197,160,89,0.12); color: #fff; }
    .sc-table tr.selected-row td:first-child { color: var(--gold); }
    .sc-unit { font-size: 0.72rem; color: var(--grey-dim); text-align: right; margin-top: 12px; }

    /* Size selector pill button highlight */
    .size-btn.on {
      border-color: var(--gold) !important;
      color: #000 !important;
      background: var(--gold-grad) !important;
      font-weight: 700 !important;
      box-shadow: 0 4px 14px rgba(197,160,89,0.3);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <i class="fa-solid fa-star"></i>&nbsp; Nationwide Delivery Available &nbsp;·&nbsp; Premium Luxury Shirts &nbsp;<i class="fa-solid fa-star"></i>
  </div>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="images/logo.jpg" alt="Unified Vogue Logo" onerror="this.style.display='none'" />
        <div class="nav-brand-text">
          <span class="nav-brand-name serif">Unified Vogue</span>
          <span class="nav-brand-tag">Your Outfits Speaks Fashion</span>
        </div>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="success.html"><i class="fa-solid fa-truck-fast"></i> Track Order</a></li>
        <li><a href="index.html#contactSection">Contact</a></li>
        <span class="nav-close" id="navClose"><i class="fa-solid fa-xmark"></i></span>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="nav-icon" title="Shopping Bag">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="nav-badge" id="navCartBadge">0</span>
        </a>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <!-- Size Chart Modal -->
  <div class="sc-overlay" id="sizeChartOverlay" onclick="closeSizeChart(event)">
    <div class="sc-modal" id="sizeChartModal">
      <div class="sc-header">
        <div>
          <h3><i class="fa-solid fa-ruler" style="color:var(--gold);margin-right:6px;font-size:0.9rem;"></i> Size Chart &amp; Measurements</h3>
          <p id="scProductName">Click any row below to choose your size</p>
        </div>
        <button class="sc-close" onclick="document.getElementById('sizeChartOverlay').classList.remove('open')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="sc-body" id="sizeChartBody">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- Product Page -->
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">Home</a>
      <i class="fa-solid fa-chevron-right"></i>
      <a href="shop.html">Shop</a>
      <i class="fa-solid fa-chevron-right"></i>
      <span id="breadcrumbTitle">Product</span>
    </nav>

    <div class="detail-layout" id="detailContainer">
      <!-- JS Injected -->
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>&copy; 2026 Unified Vogue. All Rights Reserved.</span>
      <a href="shop.html" style="color:var(--gold);">← Back to Catalog</a>
    </div>
  </footer>

  <!-- Firebase SDK (compat — works without ES modules) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cart.js"></script>

  <script>
    let selectedSize = 'S';
    let selectedQty  = 1;
    let currentProduct = null;

    function renderProductDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId    = urlParams.get('id') || 'uv-1';
      const initialSize = urlParams.get('size');
      const p         = ProductsAPI.getProductById(prodId);
      currentProduct  = p;
      const container = document.getElementById('detailContainer');

      if (!p) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:80px 20px;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:3rem; color:var(--gold); display:block; margin-bottom:14px;"></i>
            <h2 class="serif" style="margin-bottom:8px;">Loading Haute Couture Design...</h2>
            <p style="color:var(--grey); margin-bottom:20px;">Fetching design specifications from Unified Vogue atelier...</p>
          </div>`;

        // Automatically trigger remote fetch and re-render
        if (typeof ProductsAPI !== "undefined") {
          ProductsAPI.fetchRemoteCatalog().then(prods => {
            const found = prods.find(item => item.id === prodId);
            if (!found) {
              container.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:80px 20px;">
                  <i class="fa-solid fa-box-open" style="font-size:3rem; color:var(--border-gold); display:block; margin-bottom:14px;"></i>
                  <h2 class="serif" style="margin-bottom:8px;">Product Not Found</h2>
                  <p style="color:var(--grey); margin-bottom:20px;">This item is currently unavailable or has been removed from catalog.</p>
                  <a href="shop.html" class="btn btn-gold">Return to Shop</a>
                </div>`;
            } else {
              renderProductDetail();
            }
          });
        }
        return;
      }

      document.getElementById('breadcrumbTitle').textContent = p.name;
      document.title = `${p.name} — Unified Vogue`;

      const availableSizes = p.sizes && p.sizes.length > 0 ? p.sizes : ['S','M','L','XL','2XL'];
      selectedSize = (initialSize && availableSizes.includes(initialSize)) ? initialSize : availableSizes[0];

      const hasSizeChart = p.sizeChart && p.sizeChart.measurements && p.sizeChart.measurements.length > 0;

      container.innerHTML = `
        <div class="detail-gallery">
          <div class="gallery-main">
            <img src="${p.image}" alt="${p.name}" onerror="this.src='images/logo.jpg'" />
          </div>
        </div>

        <div class="detail-info">
          <div class="detail-badge-row">
            <span class="badge" style="${p.stock <= 0 ? 'background:#e63946; color:#fff;' : ''}">${p.stock <= 0 ? 'Sold Out' : (p.badge || 'New')}</span>
            <span class="detail-cat">${p.category}</span>
          </div>

          <h1 class="detail-title serif">${p.name}</h1>

          <div class="detail-stars">
            <span class="stars">★★★★★</span>
            <span class="star-note">${p.rating} rating · ${p.stock <= 0 ? '<strong style="color:#e63946;">Currently Sold Out</strong>' : `${p.stock} in stock`}</span>
          </div>

          <div class="detail-price">${App.formatMoney(p.price)}</div>

          <p class="detail-desc">${p.description}</p>

          <!-- Size Selector -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:6px;">
            <span class="size-label" style="margin-bottom:0;">
              Selected Size: <strong id="selectedSizeLabel" style="color:var(--gold-light); font-size:0.9rem;">${selectedSize}</strong>
            </span>
            ${hasSizeChart ? `
              <button type="button" onclick="openSizeChart()" style="background:none; border:none; color:var(--gold); font-size:0.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:var(--font-s); transition:var(--ease);">
                <i class="fa-solid fa-ruler"></i> Size Chart &amp; Measurements
              </button>
            ` : ''}
          </div>

          <div class="size-btns" id="sizeBtns">
            ${availableSizes.map(s => `
              <button type="button" class="size-btn ${s === selectedSize ? 'on' : ''}" data-size="${s}" onclick="setSize('${s}')">${s}</button>
            `).join('')}
          </div>

          <div class="qty-row">
            <span class="qty-label">Quantity:</span>
            <div class="qty-ctrl">
              <button type="button" class="qty-btn" onclick="changeQty(-1)">−</button>
              <span class="qty-num" id="qtyNum">1</span>
              <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>

          <div class="detail-cta">
            ${p.stock <= 0
              ? `<button type="button" class="btn btn-outline" disabled style="opacity:0.5; cursor:not-allowed; border-color:var(--border);">
                  <i class="fa-solid fa-ban"></i> Currently Sold Out
                 </button>`
              : `<button type="button" class="btn btn-gold" onclick="addToBag()">
                  <i class="fa-solid fa-bag-shopping"></i> Add to Bag
                 </button>`
            }
            <a href="cart.html" class="btn btn-outline">
              <i class="fa-solid fa-bag-shopping"></i> View Bag
            </a>
          </div>

          <div class="detail-info-box">
            <div class="info-row">
              <i class="fa-solid fa-truck-fast"></i>
              <span>Nationwide shipping available — delivery fee confirmed via chat</span>
            </div>
            <div class="info-row">
              <i class="fa-solid fa-shield-halved"></i>
              <span>Guaranteed authentic Unified Vogue design</span>
            </div>
            <div class="info-row">
              <i class="fa-solid fa-building-columns"></i>
              <span>Pay via Opay: <strong style="color:var(--gold-light);">6584992459</strong> — CHIOMA PEACE OKAFOR</span>
            </div>
            <div class="info-row">
              <i class="fa-brands fa-whatsapp"></i>
              <span>Order confirmation on WhatsApp after checkout</span>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Render from local cache immediately (no flicker)
      renderProductDetail();

      // Subscribe to Firebase — auto re-renders if admin edits this product
      ProductsAPI.subscribeToLiveCatalog(() => {
        renderProductDetail();
      });

      // Mobile nav
      const toggle = document.getElementById('navToggle');
      const links  = document.getElementById('navLinks');
      const close  = document.getElementById('navClose');
      if (toggle && links) {
        toggle.addEventListener('click', () => links.classList.add('open'));
        if (close) close.addEventListener('click', () => links.classList.remove('open'));
      }
    });

    /* ── Size Picker ── */
    function setSize(size) {
      selectedSize = size;
      const sizeLabel = document.getElementById('selectedSizeLabel');
      if (sizeLabel) sizeLabel.textContent = size;

      document.querySelectorAll('.size-btn').forEach(b => {
        if (b.getAttribute('data-size') === size) {
          b.classList.add('on');
        } else {
          b.classList.remove('on');
        }
      });

      // Highlight that row in size chart modal
      highlightChartRow(size);
    }

    /* ── Select from Size Chart Table Row ── */
    function selectSizeFromChart(size) {
      setSize(size);
      App.showToast(`Selected Size: ${size}`);
      // Close modal after brief feedback
      setTimeout(() => {
        const overlay = document.getElementById('sizeChartOverlay');
        if (overlay) overlay.classList.remove('open');
      }, 350);
    }

    /* ── Qty ── */
    function changeQty(delta) {
      selectedQty = Math.max(1, selectedQty + delta);
      document.getElementById('qtyNum').textContent = selectedQty;
    }

    /* ── Add to Bag ── */
    function addToBag() {
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'uv-1';
      CartManager.addToCart(prodId, selectedQty, selectedSize);
    }

    /* ── Size Chart Modal ── */
    function openSizeChart() {
      const p = currentProduct;
      if (!p) return;
      document.getElementById('scProductName').textContent = `${p.name} (Click a size row to select)`;
      renderSizeChart(p);
      document.getElementById('sizeChartOverlay').classList.add('open');
    }

    function closeSizeChart(e) {
      if (e.target === document.getElementById('sizeChartOverlay')) {
        document.getElementById('sizeChartOverlay').classList.remove('open');
      }
    }

    function renderSizeChart(p) {
      const body = document.getElementById('sizeChartBody');
      const sc   = p.sizeChart;

      if (!sc || !sc.measurements || sc.measurements.length === 0) {
        body.innerHTML = `
          <div class="no-chart">
            <i class="fa-solid fa-ruler-combined"></i>
            No size chart has been added for this product yet.<br>
            Please contact us on WhatsApp for measurements.
          </div>`;
        return;
      }

      const unit = sc.unit || 'inches';

      // Determine which columns exist across all rows
      const colOrder = ['length','shoulder','sleeve','chest','waist','hip'];
      const cols = colOrder.filter(k => sc.measurements.some(row => row[k] !== undefined && row[k] !== ''));

      const colLabels = {
        length:   '↕️ Length',
        shoulder: '👕 Shoulder',
        sleeve:   '👔 Sleeve',
        chest:    '📐 Chest',
        waist:    '〰️ Waist',
        hip:      '📏 Hip'
      };

      body.innerHTML = `
        <div class="sc-tip">
          <strong>How to measure:</strong><br>
          • <strong>Length</strong> — from shoulder seam to bottom hem<br>
          • <strong>Shoulder</strong> — across back from shoulder seam to seam<br>
          • <strong>Sleeve</strong> — shoulder seam down to sleeve cuff<br>
          • <strong>Chest</strong> — fullest part of chest, arms relaxed
        </div>

        <div class="sc-table-wrap">
          <table class="sc-table">
            <thead>
              <tr>
                <th>Size</th>
                ${cols.map(c => `<th>${colLabels[c]}</th>`).join('')}
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${sc.measurements.map(row => {
                const isSelected = row.size === selectedSize || (row.size === '2XL' && selectedSize === 'XXL') || (row.size === 'XXL' && selectedSize === '2XL');
                return `
                  <tr class="${isSelected ? 'selected-row' : ''}" onclick="selectSizeFromChart('${row.size}')" id="sc-row-${row.size}">
                    <td style="font-weight:800; color:${isSelected ? 'var(--gold)' : 'var(--gold-light)'};">
                      ${row.size}
                    </td>
                    ${cols.map(c => `<td>${row[c] || '—'}</td>`).join('')}
                    <td>
                      <span class="badge" style="background:${isSelected ? 'var(--gold-grad)' : 'rgba(255,255,255,0.06)'}; color:${isSelected ? '#000' : 'var(--grey)'}; font-size:0.68rem; padding:3px 8px;">
                        ${isSelected ? '<i class="fa-solid fa-check"></i> Selected' : 'Choose'}
                      </span>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>

        <p class="sc-unit">All measurements in ${unit}. Click any row above to choose your size.</p>

        <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
          <a href="https://wa.me/2349126284759?text=Hello%20Unified%20Vogue%2C%20I%20need%20help%20with%20sizing%20for%20${encodeURIComponent(p.name)}" target="_blank"
            style="display:inline-flex; align-items:center; gap:7px; background:#25D366; color:#fff; padding:9px 18px; border-radius:var(--r-full); font-size:0.82rem; font-weight:700; text-decoration:none; transition:var(--ease);">
            <i class="fa-brands fa-whatsapp"></i> Ask for Help with Sizing
          </a>
        </div>
      `;
    }

    function highlightChartRow(size) {
      document.querySelectorAll('.sc-table tbody tr').forEach(tr => {
        const isThis = tr.id === `sc-row-${size}` || (size === 'XXL' && tr.id === 'sc-row-2XL') || (size === '2XL' && tr.id === 'sc-row-XXL');
        tr.classList.toggle('selected-row', isThis);
        const badge = tr.querySelector('.badge');
        if (badge) {
          if (isThis) {
            badge.style.background = 'var(--gold-grad)';
            badge.style.color = '#000';
            badge.innerHTML = '<i class="fa-solid fa-check"></i> Selected';
          } else {
            badge.style.background = 'rgba(255,255,255,0.06)';
            badge.style.color = 'var(--grey)';
            badge.textContent = 'Choose';
          }
        }
      });
    }
  </script>
</body>
</html>
